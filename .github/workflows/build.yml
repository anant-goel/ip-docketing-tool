name: Build Windows App

# Automatic triggers: every push/PR to main/master, and any "v*" tag.
# Manual trigger: the "Run workflow" button on the Actions tab (workflow_dispatch
# below) - this is the toggle to kick off a compile on demand without pushing a
# commit. It exposes two inputs so you can choose the build config and force a
# GitHub Release attachment from an ad-hoc run.
on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      configuration:
        description: "Build configuration"
        required: true
        type: choice
        default: "Release"
        options:
          - "Release"
          - "Debug"
      create_release:
        description: "Attach the built .exe to a GitHub Release for this run"
        required: true
        type: boolean
        default: false

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/IPDocketing.App/IPDocketing.App.csproj

      - name: Build (quick verification)
        run: >
          dotnet build src/IPDocketing.App/IPDocketing.App.csproj
          -c ${{ inputs.configuration || 'Debug' }} --no-restore

      - name: Publish self-contained win-x64 executable
        run: >
          dotnet publish src/IPDocketing.App/IPDocketing.App.csproj
          -c ${{ inputs.configuration || 'Release' }}
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: IPDocketing-win-x64
          path: publish/**
          if-no-files-found: error

      - name: Create GitHub Release (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/IPDocketing.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release (manual request)
        if: github.event_name == 'workflow_dispatch' && inputs.create_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: manual-run-${{ github.run_number }}
          name: "Manual build #${{ github.run_number }}"
          files: publish/IPDocketing.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
