name: Build Windows App

# Manual-only: this workflow does NOT run automatically on push, pull
# request, or tag - pushing/uploading files to the repo will not trigger a
# build. The only way to start it is the "Run workflow" button on the
# Actions tab (workflow_dispatch below).
on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "Build configuration"
        required: true
        type: choice
        default: "Release"
        options:
          - "Release"
          - "Debug"
      architecture:
        description: "Which processor architecture(s) to build"
        required: true
        type: choice
        default: "both"
        options:
          - "both"
          - "x64 only"
          - "arm64 only"
      create_release:
        description: "Attach the built .zip to a GitHub Release for this run"
        required: true
        type: boolean
        default: false

# Required so softprops/action-gh-release can create a release with the
# default GITHUB_TOKEN. Without this, the token is read-only and release
# creation fails with a 403 "Resource not accessible by integration".
permissions:
  contents: write

jobs:
  # Decides which architectures this run should build, from the dropdown above.
  # Done as a separate job because a matrix cannot be built from an input
  # expression directly - it has to come from a job output.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        shell: bash
        run: |
          case "${{ inputs.architecture }}" in
            "x64 only")   echo 'matrix={"rid":["win-x64"]}' >> "$GITHUB_OUTPUT" ;;
            "arm64 only") echo 'matrix={"rid":["win-arm64"]}' >> "$GITHUB_OUTPUT" ;;
            *)            echo 'matrix={"rid":["win-x64","win-arm64"]}' >> "$GITHUB_OUTPUT" ;;
          esac

  build:
    needs: plan
    runs-on: windows-latest

    strategy:
      # Both architectures are built independently. fail-fast off so an arm64
      # problem doesn't throw away a good x64 build (or vice versa) - the whole
      # point of building both is finding out which ones work.
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}

    # Map the optional signing secret into an env var so the step-level
    # `if:` can test it. Secrets themselves cannot be referenced directly
    # inside `if:` conditionals (GitHub Actions restriction).
    env:
      CODE_SIGN_PFX_BASE64: ${{ secrets.CODE_SIGN_PFX_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Caches the NuGet package folder between runs. Windows App SDK is a large
      # download; without this every run pulls it fresh. Keyed on the project
      # files so it invalidates the moment a package version changes.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ matrix.rid }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-${{ matrix.rid }}-

      # Restore is the step most likely to fail on a first build, so it reports
      # the resolved package versions before anything else runs. If it dies on
      # Microsoft.WindowsAppSDK, see docs/BUILD-TROUBLESHOOTING.md and override:
      #   -p:WindowsAppSdkVersion=1.7.250606001
      - name: Restore
        run: dotnet restore src/IPDocketing.WinUI/IPDocketing.WinUI.csproj -r ${{ matrix.rid }}

      - name: Report resolved package versions
        shell: pwsh
        continue-on-error: true
        run: |
          $assets = "src/IPDocketing.WinUI/obj/project.assets.json"
          if (Test-Path $assets) {
            $json = Get-Content $assets -Raw | ConvertFrom-Json
            $json.libraries.PSObject.Properties.Name |
              Where-Object { $_ -match 'WindowsAppSDK|PdfPig|WebView2|EntityFrameworkCore/' } |
              Sort-Object |
              ForEach-Object { Write-Host "  $_" }
          }

      # Fails loudly and early if the restore silently resolved nothing, which
      # is otherwise only discovered halfway through a confusing build error.
      - name: Verify restore produced a lock of the expected packages
        shell: pwsh
        run: |
          $assets = "src/IPDocketing.WinUI/obj/project.assets.json"
          if (-not (Test-Path $assets)) {
            Write-Error "Restore did not produce project.assets.json - the restore step did not actually resolve this project."
            exit 1
          }
          Write-Host "Restore OK."

      - name: Build (quick verification)
        run: >
          dotnet build src/IPDocketing.WinUI/IPDocketing.WinUI.csproj
          -c ${{ inputs.configuration }} -r ${{ matrix.rid }} --no-restore

      - name: Publish self-contained WinUI 3 app
        run: >
          dotnet publish src/IPDocketing.WinUI/IPDocketing.WinUI.csproj
          -c ${{ inputs.configuration }}
          -r ${{ matrix.rid }}
          --self-contained true
          -o publish

      # OPTIONAL - does nothing unless you add the two secrets below.
      # This is the real fix for the Windows SmartScreen "Windows protected
      # your PC" / "Unknown publisher" warning: a valid Authenticode
      # code-signing certificate. Buy one from a CA (DigiCert, Sectigo,
      # SSL.com, etc. - "OV" builds SmartScreen reputation over downloads/
      # time, "EV" is trusted immediately but costs more), then add it to
      # this repo as two Actions secrets:
      #   CODE_SIGN_PFX_BASE64    - the .pfx certificate file, base64-encoded
      #                             (PowerShell: [Convert]::ToBase64String(
      #                             [IO.File]::ReadAllBytes("cert.pfx")) |
      #                             Set-Clipboard)
      #   CODE_SIGN_PFX_PASSWORD  - the .pfx's export password
      # With no secrets configured, this step is skipped and the build still
      # succeeds (unsigned) exactly as before.
      - name: Sign executable (optional - skipped unless a certificate secret is set)
        if: ${{ env.CODE_SIGN_PFX_BASE64 != '' }}
        shell: pwsh
        env:
          CODE_SIGN_PFX_PASSWORD: ${{ secrets.CODE_SIGN_PFX_PASSWORD }}
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:CODE_SIGN_PFX_BASE64))

          # signtool runs on the RUNNER (x64), regardless of which architecture
          # the binary targets - a signing tool signs any PE file. Picking an
          # arm64 signtool here would give an exe that cannot run on the runner.
          $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter "signtool.exe" |
            Where-Object { $_.FullName -match "\\x64\\" } | Select-Object -First 1 -ExpandProperty FullName

          & $signtool sign /f $pfxPath /p $env:CODE_SIGN_PFX_PASSWORD `
            /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
            "publish\IPDocketing.exe"

          Remove-Item $pfxPath -Force

      # Sanity check before packaging: a publish that "succeeded" but produced
      # no executable is a real failure mode with self-contained WinUI, and it
      # is far cheaper to catch here than after downloading the artifact.
      - name: Verify the executable was produced
        shell: pwsh
        run: |
          $exe = "publish/IPDocketing.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "Publish completed but $exe is missing."
            Get-ChildItem publish | Select-Object -First 40 | Format-Table Name, Length
            exit 1
          }
          $size = [math]::Round((Get-Item $exe).Length / 1KB, 1)
          $files = (Get-ChildItem publish -Recurse -File).Count
          $totalMb = [math]::Round(((Get-ChildItem publish -Recurse -File | Measure-Object Length -Sum).Sum / 1MB), 1)
          Write-Host "IPDocketing.exe present ($size KB)."
          Write-Host "Publish folder: $files file(s), $totalMb MB."

          # The TrimPublishOutput target should have removed the Windows AI
          # stack and the non-English .mui resources. If they are still here the
          # target did not run, which is worth knowing before shipping a folder
          # that is ~50 MB heavier than it needs to be.
          $leftovers = Get-ChildItem publish -File | Where-Object {
            $_.Name -like 'onnxruntime*' -or $_.Name -eq 'DirectML.dll' -or $_.Name -like 'Microsoft.Windows.AI*'
          }
          if ($leftovers) {
            Write-Warning "TrimPublishOutput did not run - $($leftovers.Count) unused AI runtime file(s) still present."
          } else {
            Write-Host "Trim confirmed: no unused AI runtime files in the publish output."
          }

          $extraLocales = Get-ChildItem publish -Directory | Where-Object {
            $_.Name -match '^[a-z]{2}(-[A-Za-z]+)+$' -and $_.Name -notlike 'en-*'
          }
          if ($extraLocales) {
            Write-Warning "$($extraLocales.Count) non-English locale folder(s) still present."
          }

      - name: Zip publish output into a single archive
        shell: pwsh
        run: |
          Compress-Archive -Path publish\* -DestinationPath IPDocketing-${{ matrix.rid }}.zip -Force

      - name: Upload build artifact (single zip)
        uses: actions/upload-artifact@v4
        with:
          name: IPDocketing-${{ matrix.rid }}
          path: IPDocketing-${{ matrix.rid }}.zip
          if-no-files-found: error
          retention-days: 30

      # Both matrix jobs target the same tag on purpose, so one release ends up
      # carrying both architectures' zips. The action updates an existing
      # release rather than failing when the second job arrives.
      - name: Create GitHub Release (optional)
        if: inputs.create_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: manual-run-${{ github.run_number }}
          name: "Manual build #${{ github.run_number }}"
          files: IPDocketing-${{ matrix.rid }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
